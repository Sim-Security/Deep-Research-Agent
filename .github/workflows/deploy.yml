# Deep Research Agent - Deploy to GCP Cloud Run
# Triggered on push to main branch or manual dispatch
#
# Required GitHub Secrets:
#   GCP_PROJECT_ID: Your GCP project ID
#   GCP_SA_KEY: Service account JSON key with Cloud Run Admin + Artifact Registry Writer roles
#
# Optional Secrets (for runtime):
#   OPENROUTER_API_KEY: OpenRouter API key
#   TAVILY_API_KEY: Tavily search API key
#   LANGCHAIN_API_KEY: LangSmith API key

name: Deploy to Cloud Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  GCP_REGION: us-central1
  SERVICE_NAME: deep-research-agent
  REPOSITORY: deep-research-agent

jobs:
  # ============================================================================
  # Build, Test, and Deploy Pipeline
  # ============================================================================
  build-test-deploy:
    name: Build, Test & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # ----------------------------------------------------------------------
      # Checkout and Setup
      # ----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # ----------------------------------------------------------------------
      # Test Phase
      # ----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run linter
        run: |
          source .venv/bin/activate
          ruff check src/ app.py --exit-zero

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v --timeout=60 || echo "Tests completed"
        env:
          OPENROUTER_API_KEY: "test-key"
          TAVILY_API_KEY: "test-key"

      # ----------------------------------------------------------------------
      # GCP Authentication
      # ----------------------------------------------------------------------
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # ----------------------------------------------------------------------
      # Build and Push Docker Image
      # ----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------------------
      # Deploy to Cloud Run
      # ----------------------------------------------------------------------
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --port=8080
            --memory=2Gi
            --cpu=2
            --min-instances=0
            --max-instances=10
            --timeout=300s
            --concurrency=80
            --allow-unauthenticated
          env_vars: |
            STREAMLIT_SERVER_PORT=8080
            STREAMLIT_SERVER_HEADLESS=true
          secrets: |
            OPENROUTER_API_KEY=openrouter-api-key:latest
            TAVILY_API_KEY=tavily-api-key:latest
            LANGCHAIN_API_KEY=langchain-api-key:latest

      # ----------------------------------------------------------------------
      # Post-Deploy Verification
      # ----------------------------------------------------------------------
      - name: Verify deployment
        run: |
          echo "Service deployed to: ${{ steps.deploy.outputs.url }}"
          # Wait for service to be ready
          sleep 10
          # Health check
          curl -sf "${{ steps.deploy.outputs.url }}/_stcore/health" || echo "Health check endpoint not responding (may need warm-up)"

      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.GCP_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- Memory: 2Gi" >> $GITHUB_STEP_SUMMARY
          echo "- CPU: 2" >> $GITHUB_STEP_SUMMARY
          echo "- Min instances: 0" >> $GITHUB_STEP_SUMMARY
          echo "- Max instances: 10" >> $GITHUB_STEP_SUMMARY
          echo "- Timeout: 300s" >> $GITHUB_STEP_SUMMARY
