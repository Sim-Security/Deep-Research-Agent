# Deep Research Agent - Cloud Build Configuration
# Builds and deploys to GCP Cloud Run
#
# Prerequisites:
#   - Enable Cloud Build, Cloud Run, and Artifact Registry APIs
#   - Create Artifact Registry repository: deep-research-agent
#   - Grant Cloud Build service account Cloud Run Admin role
#
# Manual trigger:
#   gcloud builds submit --config cloudbuild.yaml
#
# Substitution variables (set in Cloud Build trigger or command line):
#   _REGION: GCP region (default: us-central1)
#   _SERVICE_NAME: Cloud Run service name (default: deep-research-agent)
#   _REPOSITORY: Artifact Registry repository (default: deep-research-agent)

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: deep-research-agent
  _REPOSITORY: deep-research-agent

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ============================================================================
  # Step 1: Build Docker image
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
      - '.'

  # ============================================================================
  # Step 2: Push to Artifact Registry
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}'
    waitFor: ['build']

  # ============================================================================
  # Step 3: Deploy to Cloud Run
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300s'
      - '--concurrency'
      - '80'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'STREAMLIT_SERVER_PORT=8080,STREAMLIT_SERVER_HEADLESS=true'
    waitFor: ['push']

# Image to store in Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'

# Build timeout (10 minutes)
timeout: '600s'

# Tags for filtering builds
tags:
  - 'deep-research-agent'
  - 'cloud-run'
  - 'streamlit'
