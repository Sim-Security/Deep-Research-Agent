[project]
name = "deep-research-agent"
version = "0.1.0"
description = "A LangGraph-powered deep research agent with parallel research, citation tracking, and Streamlit UI."
authors = [
    { name = "Adam", email = "adam@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    # LangChain / LangGraph Core
    "langgraph>=0.5.4",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.9",
    
    # LLM Providers (via OpenRouter for flexibility)
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    
    # Search APIs
    "duckduckgo-search>=7.0.0",
    "tavily-python>=0.5.0",
    
    # Observability
    "langsmith>=0.3.0",
    
    # Web & Utils
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    
    # UI
    "streamlit>=1.30.0",
    
    # Async
    "asyncio-throttle>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deep_research"]

[tool.setuptools.package-dir]
"deep_research" = "src/deep_research"

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
]
lint.ignore = [
    "E501", # line too long
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
